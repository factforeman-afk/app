name: Build Android App
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create all project files
        run: |
          pip install numpy
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.onelove.launcher"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.onelove.launcher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              signingConfigs {
                  create("release") {
                      val ks = System.getenv("KEYSTORE_PATH")
                      if (ks != null) {
                          storeFile = file(ks)
                          storePassword = System.getenv("KEYSTORE_PASSWORD")
                          keyAlias = System.getenv("KEY_ALIAS")
                          keyPassword = System.getenv("KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      if (System.getenv("KEYSTORE_PATH") != null) {
                          signingConfig = signingConfigs.getByName("release")
                      }
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint { checkReleaseBuilds = false }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
          }
          EOF_FILE
          mkdir -p app
          cat > app/proguard-rules.pro <<'EOF_FILE'
          # default rules are enough; app uses no reflection
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- No <uses-permission> entries at all. The <queries> block is what lets
