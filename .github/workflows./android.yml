          import math, wave, numpy as np
          R = "app/src/main/res/"

          # ---------------- leaf vector ----------------
          def prof(t): return (t ** 0.6) * ((1 - t) ** 0.95)
          MX = max(prof(i / 300) for i in range(1, 300))
          CX, CY = 50.0, 66.0

          def leaflet(ang, L, W, teeth):
              a = math.radians(ang)
              def tr(u, v):
                  return (CX + u * math.cos(a) + v * math.sin(a), CY + u * math.sin(a) - v * math.cos(a))
              N = teeth * 8
              left, right = [], []
              for i in range(N + 1):
                  t = i / N
                  w = W * prof(t) / MX
                  frac = (t * teeth) % 1.0 if 0 < t < 1 else 0
                  w *= 0.78 + 0.22 * frac
                  left.append(tr(-w, t * L)); right.append(tr(w, t * L))
              veins = []
              for k in range(1, 8):
                  t = 0.1 + k * 0.1
                  t2 = min(t + 0.13, 0.97)
                  w2 = 0.85 * W * prof(t2) / MX
                  m = tr(0, t * L)
                  for sgn in (-1, 1):
                      e = tr(sgn * w2, t2 * L)
                      veins.append(f"M{m[0]:.1f},{m[1]:.1f}L{e[0]:.1f},{e[1]:.1f}")
              return left, right, tr(0, 0), tr(0, L), "".join(veins)

          def poly(pts): return "M" + "L".join(f"{x:.1f},{y:.1f}" for x, y in pts) + "Z"
          def cx_of(pts): return sum(p[0] for p in pts) / len(pts)

          def grad(d, base, tip, c0, c1, stroke="#0E3A12"):
              return (f'<path android:pathData="{d}" android:strokeColor="{stroke}" android:strokeWidth="0.4" android:strokeLineJoin="round">'
                      f'<aapt:attr name="android:fillColor"><gradient android:type="linear" android:startX="{base[0]:.1f}" android:startY="{base[1]:.1f}" '
                      f'android:endX="{tip[0]:.1f}" android:endY="{tip[1]:.1f}"><item android:offset="0" android:color="{c0[0]}"/>'
                      f'<item android:offset="1" android:color="{c0[1]}"/></gradient></aapt:attr></path>')

          specs = [(95, 22, 3.8, 7), (57, 33, 5.2, 9), (28, 40, 6.2, 10), (0, 46, 7.0, 11)]
          LIGHT = ("#86CF47", "#2F7D22"); DARK = ("#4E9A2C", "#17561C")
          body = ['<path android:pathData="M50,66C50,76 51,84 50,93" android:strokeColor="#5C8A2E" android:strokeWidth="1.8" android:strokeLineCap="round"/>']
          for ang, L, W, teeth in specs:
              for s in ([1] if ang == 0 else [-1, 1]):
                  l, r, base, tip, veins = leaflet(s * ang, L, W, teeth)
                  light_left = cx_of(l) <= cx_of(r)
                  body.append(grad(poly(l), base, tip, LIGHT if light_left else DARK, None))
                  body.append(grad(poly(r), base, tip, DARK if light_left else LIGHT, None))
                  body.append(f'<path android:pathData="M{base[0]:.1f},{base[1]:.1f}L{tip[0]:.1f},{tip[1]:.1f}" android:strokeColor="#C9EE8E" android:strokeWidth="0.8" android:strokeLineCap="round"/>')
                  body.append(f'<path android:pathData="{veins}" android:strokeColor="#1B5A1A" android:strokeAlpha="0.55" android:strokeWidth="0.3"/>')
          body = "\n    ".join(body)
          HDR = '<?xml version="1.0" encoding="utf-8"?>\n'
          open(R + "drawable/ic_leaf.xml", "w").write(HDR +
           '<vector xmlns:android="http://schemas.android.com/apk/res/android" xmlns:aapt="http://schemas.android.com/aapt"\n'
           '    android:width="100dp" android:height="100dp" android:viewportWidth="100" android:viewportHeight="100">\n    ' + body + '\n</vector>\n')
          open(R + "drawable/ic_launcher_foreground.xml", "w").write(HDR +
           '<vector xmlns:android="http://schemas.android.com/apk/res/android" xmlns:aapt="http://schemas.android.com/aapt"\n'
           '    android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">\n'
           '    <group android:translateX="4" android:translateY="-4">\n    ' + body + '\n    </group>\n</vector>\n')
          open(R + "drawable/ic_launcher_background.xml", "w").write(HDR +
           '<vector xmlns:android="http://schemas.android.com/apk/res/android" xmlns:aapt="http://schemas.android.com/aapt"\n'
           '    android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">\n'
           '    <path android:fillColor="#C1272D" android:pathData="M0,0h108v36h-108z"/>\n'
           '    <path android:fillColor="#F2B705" android:pathData="M0,36h108v36h-108z"/>\n'
           '    <path android:fillColor="#1E8E3E" android:pathData="M0,72h108v36h-108z"/>\n'
           '    <path android:pathData="M0,0h108v108h-108z"><aapt:attr name="android:fillColor"><gradient android:type="radial" '
           'android:centerX="54" android:centerY="54" android:gradientRadius="80"><item android:offset="0" android:color="#00000000"/>'
           '<item android:offset="1" android:color="#88000000"/></gradient></aapt:attr></path>\n</vector>\n')

          # ---------------- cough audio ----------------
          sr = 22050
          def bandnoise(n, lo, hi, rng):
              X = np.fft.rfft(rng.standard_normal(n)); f = np.fft.rfftfreq(n, 1 / sr)
              X *= ((f > lo) & (f < hi)); return np.fft.irfft(X, n)
          def cough(f0, seed, dur):
              rng = np.random.default_rng(seed); n = int(sr * dur); t = np.arange(n) / sr
              burst = bandnoise(n, 400, 4500, rng) * np.where(t < .004, t / .004, np.exp(-(t - .004) / .04))
              t0 = .045; tv = np.clip(t - t0, 0, None)
              f = f0 * (1 - .25 * np.clip(tv / .3, 0, 1)); ph = 2 * np.pi * np.cumsum(f) / sr
              v = np.zeros(n)
              for k in range(1, 40):
                  fk = k * f0
                  w = np.exp(-((fk - 750) / 260) ** 2) + .7 * np.exp(-((fk - 1300) / 350) ** 2) + .3 * np.exp(-((fk - 2500) / 500) ** 2) + .05
                  v += w / k ** .6 * np.sin(k * ph)
              env = np.where(t < t0, 0, np.minimum(tv / .01, 1) * np.exp(-tv / .11))
              v *= env * (1 + .35 * np.sin(2 * np.pi * 65 * t))
              asp = bandnoise(n, 600, 3500, rng) * env
              pk = lambda x: x / (np.abs(x).max() + 1e-9)
              sig = .8 * pk(burst) + .7 * pk(v) + .35 * pk(asp)
              sig *= np.minimum(1, (n - np.arange(n)) / (sr * .02))
              return (pk(sig) * .9 * 32767).astype(np.int16)
          for name, f0, seed, dur in (("cough1", 150, 3, .55), ("cough2", 128, 11, .7)):
              w = wave.open(R + f"raw/{name}.wav", "wb"); w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              w.writeframes(cough(f0, seed, dur).tobytes()); w.close()
          print("generated")
          EOF_FILE
